<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" role="img" aria-labelledby="t d" font-family="IBM Plex Sans, system-ui, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">BoviShift evaluation design</title>
  <desc id="d">Three protocols. P1 random split: the same animals appear in train and test. P2 identity-disjoint: test animals never appear in training. P3 temporally forward: test animals are new and come from later years. The P1 to P2 gap measures identity leakage; the P2 to P3 gap measures temporal distribution shift.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5C6A70"/></marker>
    <g id="cow"><circle r="15" fill="#F4F5F0" stroke="#17242B" stroke-width="1.4"/></g>
    <g id="leak"><circle r="15" fill="#F6E4DE" stroke="#A8442A" stroke-width="2"/></g>
  </defs>
  <style>
    .h{font-size:17px;font-weight:600;fill:#17242B}
    .s{font-size:13px;fill:#5C6A70}
    .lab{font-size:12px;fill:#8A9490;letter-spacing:.02em}
    .id{font-size:13px;font-weight:600;fill:#17242B;text-anchor:middle;dominant-baseline:central}
    .idl{font-size:13px;font-weight:600;fill:#A8442A;text-anchor:middle;dominant-baseline:central}
    .box{fill:none;stroke:#A9B0A6;stroke-width:1.2;rx:8}
    .gap{font-size:13.5px;font-weight:600}
  </style>

  <!-- P1 -->
  <text x="20" y="30" class="h">P1  Random split</text>
  <text x="20" y="50" class="s">Photos shuffled; animals repeat</text>
  <rect x="20" y="68" width="260" height="92" class="box"/><text x="32" y="86" class="lab">TRAIN</text>
  <use href="#cow" x="70" y="122"/><text x="70" y="122" class="id">A</text>
  <use href="#cow" x="120" y="122"/><text x="120" y="122" class="id">B</text>
  <use href="#cow" x="170" y="122"/><text x="170" y="122" class="id">C</text>
  <use href="#cow" x="220" y="122"/><text x="220" y="122" class="id">D</text>
  <rect x="20" y="176" width="260" height="92" class="box"/><text x="32" y="194" class="lab">TEST</text>
  <use href="#leak" x="95" y="230"/><text x="95" y="230" class="idl">A</text>
  <use href="#leak" x="150" y="230"/><text x="150" y="230" class="idl">C</text>
  <use href="#cow" x="205" y="230"/><text x="205" y="230" class="id">E</text>
  <text x="20" y="292" class="s">A and C were already seen in training</text>

  <!-- P2 -->
  <text x="350" y="30" class="h">P2  Identity-disjoint</text>
  <text x="350" y="50" class="s">No animal appears on both sides</text>
  <rect x="350" y="68" width="260" height="92" class="box"/><text x="362" y="86" class="lab">TRAIN</text>
  <use href="#cow" x="400" y="122"/><text x="400" y="122" class="id">A</text>
  <use href="#cow" x="450" y="122"/><text x="450" y="122" class="id">B</text>
  <use href="#cow" x="500" y="122"/><text x="500" y="122" class="id">C</text>
  <use href="#cow" x="550" y="122"/><text x="550" y="122" class="id">D</text>
  <rect x="350" y="176" width="260" height="92" class="box"/><text x="362" y="194" class="lab">TEST</text>
  <use href="#cow" x="430" y="230"/><text x="430" y="230" class="id">E</text>
  <use href="#cow" x="480" y="230"/><text x="480" y="230" class="id">F</text>
  <use href="#cow" x="530" y="230"/><text x="530" y="230" class="id">G</text>
  <text x="350" y="292" class="s">New animals, drawn from the same years</text>

  <!-- P3 -->
  <text x="680" y="30" class="h">P3  Temporally forward</text>
  <text x="680" y="50" class="s">New animals from later years</text>
  <rect x="680" y="68" width="260" height="92" class="box"/><text x="692" y="86" class="lab">TRAIN  ·  EARLIER YEARS</text>
  <use href="#cow" x="730" y="122"/><text x="730" y="122" class="id">A</text>
  <use href="#cow" x="780" y="122"/><text x="780" y="122" class="id">B</text>
  <use href="#cow" x="830" y="122"/><text x="830" y="122" class="id">C</text>
  <use href="#cow" x="880" y="122"/><text x="880" y="122" class="id">D</text>
  <rect x="680" y="176" width="260" height="92" class="box"/><text x="692" y="194" class="lab">TEST  ·  LATER YEARS</text>
  <use href="#cow" x="760" y="230"/><text x="760" y="230" class="id">H</text>
  <use href="#cow" x="810" y="230"/><text x="810" y="230" class="id">I</text>
  <use href="#cow" x="860" y="230"/><text x="860" y="230" class="id">J</text>
  <text x="680" y="292" class="s">The population itself has moved</text>

  <!-- gaps -->
  <path d="M150,322 L480,322" stroke="#5C6A70" stroke-width="1.3" fill="none" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <text x="315" y="350" class="gap" fill="#A8442A" text-anchor="middle">P1 → P2 gap = identity leakage</text>
  <path d="M480,322 L810,322" stroke="#5C6A70" stroke-width="1.3" fill="none" marker-end="url(#ah)"/>
  <text x="645" y="350" class="gap" fill="#1F6F63" text-anchor="middle">P2 → P3 gap = temporal shift</text>
</svg>
